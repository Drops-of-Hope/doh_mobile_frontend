name: EAS Build (Android)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript + ESLint gate
        run: pnpm lint

      # Requires an EXPO_TOKEN repository secret (expo.dev → Access Tokens)
      # and EAS-managed Android credentials (run `eas credentials` once).
      # --no-wait: the build runs on EAS servers; check expo.dev for status.
      - name: EAS Build (production AAB)
        run: eas build --platform android --profile production --non-interactive --no-wait
