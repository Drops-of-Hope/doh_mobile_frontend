name: Lint React Native App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 TypeScript Check
        run: pnpm lint:tsc

      - name: 🧹 Run ESLint
        run: pnpm lint:eslint

      - name: 🌐 Locale Completeness Check
        run: node scripts/compareLocales.js || echo "Locale gaps found (non-blocking, tracked in roadmap P4 i18n)"
